<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roda da Sorte - AE Verde Horizonte</title>
  <!-- Importação da fonte Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #00e676;
      font-family: 'Lexend', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .widget-container {
      display: flex;
      flex-direction: row;
      gap: 30px;
      align-items: center;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
      flex-wrap: wrap;
    }
    .wheel-box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 32px solid #212121;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    canvas {
      border: 6px solid #212121;
      border-radius: 50%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      background: #ffffff;
    }
    .result-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1a237e;
      margin-top: 15px;
      min-height: 2.8rem;
      text-align: center;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 320px;
      max-width: 100%;
    }
    label {
      font-size: 1rem;
      font-weight: 600;
      color: #212121;
    }
    textarea {
      width: 100%;
      height: 220px;
      padding: 12px;
      border: 2px solid #00e676;
      border-radius: 12px;
      font-family: 'Lexend', sans-serif;
      font-size: 0.95rem;
      color: #1b5e20;
      background: #f0fdf4;
      outline: none;
      resize: vertical;
    }
    textarea:focus {
      border-color: #00a854;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      background: #f0fdf4;
      color: #00a854;
      border: 2px solid #00e676;
      font-family: 'Lexend', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #00e676;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="500" height="500"></canvas>
      <div class="result-display" id="result">Pressione RODAR</div>
    </div>

    <div class="sidebar">
      <label for="namesInput">Lista de Nomes (um por linha):</label>
      <textarea id="namesInput" placeholder="Cole a lista da caderneta aqui..."></textarea>
      <div class="controls">
        <button onclick="updateWheel()">Atualizar Roda</button>
        <button onclick="spinWheel()">RODAR</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const namesInput = document.getElementById('namesInput');
    const resultDiv = document.getElementById('result');

    const defaultNames = ["Ana Silva", "Bernardo Costa", "Carla Santos", "Diogo Ferreira", "Elena Rocha", "Filipe Martins", "Inês Henriques", "João Oliveira"];
    namesInput.value = defaultNames.join('\n');

    let names = [];
    let startAngle = 0;
    let isSpinning = false;

    const colors = [
      "#ff1744", "#29b6f6", "#ffca28", "#ab47bc",
      "#ff7043", "#00e676", "#ec407a", "#26a69a"
    ];

    function getNames() {
      const text = namesInput.value.trim();
      return text ? text.split('\n').map(n => n.trim()).filter(n => n.length > 0) : [];
    }

    function drawWheel() {
      names = getNames();
      const numOptions = names.length;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numOptions === 0) {
        resultDiv.textContent = "Insira nomes";
        return;
      }

      const arc = (2 * Math.PI) / numOptions;

      for (let i = 0; i < numOptions; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.arc(radius, radius, radius - 8, angle, angle + arc, false);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = "#ffffff";
        
        const fontSize = Math.max(16, Math.min(26, Math.floor(360 / numOptions)));
        ctx.font = `bold ${fontSize}px 'Lexend', sans-serif`;

        ctx.translate(
          radius + Math.cos(angle + arc / 2) * (radius * 0.55), 
          radius + Math.sin(angle + arc / 2) * (radius * 0.55)
        );
        
        ctx.rotate(angle + arc / 2);
        
        const nameText = names[i].length > 18 ? names[i].substring(0, 16) + ".." : names[i];
        ctx.fillText(nameText, -ctx.measureText(nameText).width / 2, fontSize / 3);
        ctx.restore();
      }
    }

    function updateWheel() {
      if (isSpinning) return;
      drawWheel();
      resultDiv.textContent = "Roda Atualizada!";
    }

    function spinWheel() {
      if (isSpinning) return;
      names = getNames();
      if (names.length === 0) return;

      isSpinning = true;
      resultDiv.textContent = "A rodar...";

      // Parâmetros de simulação física baseada em atrito contínuo (Apenas rotação para a frente)
      let currentVelocity = Math.random() * 0.15 + 0.35; // Velocidade angular inicial em rad/frame
      const friction = 0.992; // Atrito reduzido (perde velocidade muito lentamente)

      function animate() {
        if (currentVelocity <= 0.0003) {
          // Quando a velocidade fica residual, travamos a roda de forma limpa
          stopRotateWheel();
          return;
        }

        // A velocidade decai por atrito constante, rodando sempre no sentido horário
        currentVelocity *= friction;
        startAngle += currentVelocity;
        
        drawWheel();
        requestAnimationFrame(animate);
      }

      animate();
    }

    function stopRotateWheel() {
      isSpinning = false;
      const numOptions = names.length;
      const arc = (2 * Math.PI) / numOptions;
      
      const targetAngle = (3 * Math.PI / 2);
      let normalizedAngle = (targetAngle - (startAngle % (2 * Math.PI))) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const index = Math.floor(normalizedAngle / arc);

      resultDiv.textContent = "Selecionado: " + names[index];
    }

    drawWheel();
  </script>
</body>
</html>
