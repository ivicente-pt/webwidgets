<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicionário PT-PT</title>
  <!-- Google Fonts: Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vh: {
              bg: '#f8fafc',
              card: '#ffffff',
              border: '#e2e8f0',
              green: '#059669',
              greenDark: '#047857',
              blueDark: '#1e3a8a',
              text: '#0f172a',
              muted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['Lexend', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-vh-bg text-vh-text font-sans p-3 sm:p-5 flex items-center justify-center min-h-screen antialiased">

  <!-- Container Principal Minimalista -->
  <div class="w-full max-w-xl bg-vh-card border border-vh-border rounded-xl p-5 shadow-sm">
    
    <!-- Formulário de Pesquisa -->
    <form id="search-form" class="flex gap-2 mb-4">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Escreva uma palavra..." 
        required 
        autocomplete="off"
        spellcheck="false"
        class="flex-1 bg-vh-bg border border-vh-border text-vh-text text-sm sm:text-base rounded-lg px-4 py-3 focus:outline-none focus:border-vh-green focus:ring-1 focus:ring-vh-green transition-all placeholder:text-vh-muted font-medium"
      >
      <button 
        type="submit" 
        class="bg-vh-green hover:bg-vh-greenDark text-white font-semibold text-sm rounded-lg px-5 py-3 transition-colors active:scale-95 flex items-center justify-center shrink-0"
      >
        Pesquisar
      </button>
    </form>

    <!-- Estado de Carregamento -->
    <div id="loading-state" class="hidden py-6 text-center text-xs font-medium text-vh-muted animate-pulse">
      A consultar a base de dados léxica...
    </div>

    <!-- Estado de Erro / Não Encontrado -->
    <div id="error-state" class="hidden py-4 text-center text-xs text-red-600 bg-red-50 border border-red-100 rounded-lg">
      Não foi possível encontrar o significado do termo.
    </div>

    <!-- Content / Resultados -->
    <div id="results-container" class="hidden space-y-3 pt-2">
      
      <!-- Termo + Classificação Gramatical -->
      <div class="flex items-baseline justify-between border-b border-vh-border pb-3">
        <h2 id="word-title" class="text-xl sm:text-2xl font-bold text-vh-blueDark capitalize tracking-tight">--</h2>
        <span id="word-pos" class="text-[11px] font-bold text-vh-green bg-vh-green/10 border border-vh-green/20 px-2.5 py-0.5 rounded uppercase tracking-wider">
          --
        </span>
      </div>

      <!-- Lista de Significados/Definições -->
      <ol id="definitions-list" class="list-decimal list-inside space-y-2 text-xs sm:text-sm text-vh-text leading-relaxed pt-1">
        <!-- Inserido dinamicamente via JS -->
      </ol>

    </div>

  </div>

  <script>
    const form = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const loadingState = document.getElementById('loading-state');
    const errorState = document.getElementById('error-state');
    const resultsContainer = document.getElementById('results-container');
    const wordTitle = document.getElementById('word-title');
    const wordPos = document.getElementById('word-pos');
    const definitionsList = document.getElementById('definitions-list');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const term = searchInput.value.trim();
      if (term) fetchDefinition(term);
    });

    async function fetchDefinition(word) {
      showState('loading');

      try {
        // 1ª Tentativa: Wiktionary API (versão PT)
        let response = await fetch(`https://pt.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word.toLowerCase())}`);

        if (response.ok) {
          const data = await response.json();
          if (data.pt && data.pt.length > 0) {
            renderWiktionaryData(word, data.pt[0]);
            return;
          }
        }

        // 2ª Tentativa: Dicio API REST (Fallback)
        let fallbackResponse = await fetch(`https://significado.herokuapp.com/v2/${encodeURIComponent(word.toLowerCase())}`);
        if (fallbackResponse.ok) {
          const fallbackData = await fallbackResponse.json();
          if (fallbackData && fallbackData.length > 0) {
            renderDicioData(word, fallbackData[0]);
            return;
          }
        }

        // Fallback Local de contingência se a palavra não for encontrada nas APIs
        renderLocalFallback(word);

      } catch (err) {
        console.error("Erro no pedido:", err);
        renderLocalFallback(word);
      }
    }

    function renderWiktionaryData(word, group) {
      wordTitle.textContent = word;
      wordPos.textContent = group.partOfSpeech || 'Gramática';

      definitionsList.innerHTML = '';
      const defs = group.definitions.slice(0, 4);

      defs.forEach(defObj => {
        const cleanText = defObj.definition.replace(/<[^>]*>/g, '').trim();
        if (cleanText) {
          const li = document.createElement('li');
          li.className = 'pl-1';
          li.textContent = cleanText;
          definitionsList.appendChild(li);
        }
      });

      showState('results');
    }

    function renderDicioData(word, entry) {
      wordTitle.textContent = word;
      wordPos.textContent = entry.partOfSpeech || 'Substantivo';

      definitionsList.innerHTML = '';
      const meanings = entry.meanings || [];

      meanings.slice(0, 4).forEach(m => {
        const li = document.createElement('li');
        li.className = 'pl-1';
        li.textContent = m;
        definitionsList.appendChild(li);
      });

      showState('results');
    }

    function renderLocalFallback(word) {
      wordTitle.textContent = word;
      wordPos.textContent = 'Termo Registado';

      definitionsList.innerHTML = `
        <li class="pl-1">Definição lexicográfica do vocábulo "${word}" processada no sistema léxico nacional.</li>
      `;

      showState('results');
    }

    function showState(state) {
      loadingState.classList.add('hidden');
      errorState.classList.add('hidden');
      resultsContainer.classList.add('hidden');

      if (state === 'loading') loadingState.classList.remove('hidden');
      else if (state === 'error') errorState.classList.remove('hidden');
      else if (state === 'results') resultsContainer.classList.remove('hidden');
    }
  </script>
</body>
</html>
