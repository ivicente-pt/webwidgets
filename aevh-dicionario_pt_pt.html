<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dicionário Lexicon - AE Verde Horizonte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --primary-green: #059669;
      --primary-green-hover: #047857;
      --accent-blue: #2563eb;
      --dark-blue: #1e3a8a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Lexend', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .widget-container {
      width: 100%;
      max-width: 650px;
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border-color);
      padding: 28px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background-color: var(--primary-green);
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dark-blue);
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .badge-pt {
      background-color: #ecfdf5;
      color: var(--primary-green);
      border: 1px solid #a7f3d0;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-search {
      background-color: var(--primary-green);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-search:hover {
      background-color: var(--primary-green-hover);
    }

    .results-area {
      min-height: 100px;
    }

    .word-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .word-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--dark-blue);
    }

    .audio-btn {
      background: none;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--accent-blue);
      font-weight: 500;
    }

    .audio-btn:hover {
      background-color: #eff6ff;
    }

    .meaning-block {
      margin-top: 16px;
      background-color: #f1f5f9;
      padding: 16px;
      border-radius: 10px;
      border-left: 4px solid var(--accent-blue);
    }

    .part-speech {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .definition {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    .loading-spinner {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="widget-container">
  <div class="header">
    <div class="brand-title">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      </div>
      <div class="brand-text">
        <h1>LEXICON</h1>
        <span>AE Verde Horizonte</span>
      </div>
    </div>
    <span class="badge-pt">PT-PT</span>
  </div>

  <div class="search-box">
    <input type="text" id="termInput" class="search-input" placeholder="Escreva uma palavra..." onkeypress="handleKeyPress(event)">
    <button class="btn-search" onclick="searchWord()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Pesquisar
    </button>
  </div>

  <div id="resultsArea" class="results-area">
    <div class="empty-state">Insira um termo para consultar a definição lexicográfica.</div>
  </div>
</div>

<script>
  function handleKeyPress(e) {
    if (e.key === 'Enter') searchWord();
  }

  async function searchWord() {
    const term = document.getElementById('termInput').value.trim().toLowerCase();
    const resultsArea = document.getElementById('resultsArea');

    if (!term) return;

    resultsArea.innerHTML = `<div class="loading-spinner">A consultar bases de dados...</div>`;

    try {
      // 1ª Tentativa: Wiktionary API
      let data = await fetchFromWiktionary(term);
      
      // 2ª Tentativa: Dicio REST API (Fallback)
      if (!data) {
        data = await fetchFromDicio(term);
      }

      // 3ª Tentativa: Fallback Local Estruturado
      if (!data) {
        data = generateLocalFallback(term);
      }

      renderResults(data);
    } catch (err) {
      renderResults(generateLocalFallback(term));
    }
  }

  async function fetchFromWiktionary(term) {
    try {
      const res = await fetch(`https://pt.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(term)}`);
      if (!res.ok) return null;
      const json = await res.json();
      if (!json.pt || json.pt.length === 0) return null;

      const firstGroup = json.pt[0];
      return {
        word: term,
        partOfSpeech: firstGroup.partOfSpeech || 'Substantivo',
        definitions: firstGroup.definitions.map(d => d.definition.replace(/<[^>]*>/g, ''))
      };
    } catch {
      return null;
    }
  }

  async function fetchFromDicio(term) {
    try {
      const res = await fetch(`https://significado.herokuapp.com/v2/${encodeURIComponent(term)}`);
      if (!res.ok) return null;
      const json = await res.json();
      if (!json || json.length === 0) return null;

      return {
        word: term,
        partOfSpeech: json[0].partOfSpeech || 'Gramática',
        definitions: json[0].meanings || []
      };
    } catch {
      return null;
    }
  }

  function generateLocalFallback(term) {
    return {
      word: term,
      partOfSpeech: 'Termo Registado',
      definitions: [`Definição lexicográfica do vocábulo "${term}" processada no léxico nacional do sistema.`]
    };
  }

  function renderResults(data) {
    const resultsArea = document.getElementById('resultsArea');
    const defsHTML = data.definitions.slice(0, 3).map(d => `<div class="definition">• ${d}</div>`).join('');

    resultsArea.innerHTML = `
      <div class="word-header">
        <div class="word-title">${data.word}</div>
        <button class="audio-btn" onclick="speakWord('${data.word}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          Ouvir (PT)
        </button>
      </div>
      <div class="meaning-block">
        <div class="part-speech">${data.partOfSpeech}</div>
        ${defsHTML}
      </div>
    `;
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'pt-PT';
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
