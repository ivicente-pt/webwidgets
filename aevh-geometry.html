<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padrões Geométricos - AE Verde Horizonte</title>
  <!-- Importação da fonte Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #212121;
      font-family: 'Lexend', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px 20px 20px;
    }
    .widget-container {
      display: flex;
      flex-direction: row;
      gap: 30px;
      align-items: flex-start;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
      flex-wrap: wrap;
    }
    .canvas-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    canvas {
      border: 4px solid #212121;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      background: #ffffff;
    }
    
    /* Display de Informação com Notação Fracionária Vertical */
    .info-display {
      font-size: 1.4rem;
      font-weight: 800;
      color: #1a237e;
      text-align: center;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .fraction-display {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1;
      color: #1a237e;
    }
    .fraction-numerator {
      border-bottom: 3px solid #1a237e;
      padding: 0 6px 2px 6px;
      display: block;
    }
    .fraction-denominator {
      padding: 2px 6px 0 6px;
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 320px;
      max-width: 100%;
      background: #f8fafc;
      padding: 24px;
      border-radius: 20px;
      border: 3px solid #212121;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      display: flex;
      justify-content: space-between;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-family: 'Lexend', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
      background: #ffffff;
    }
    select:focus {
      border-color: #29b6f6;
    }
    input[type="range"] {
      accent-color: #29b6f6;
      padding: 0;
      cursor: pointer;
    }
    
    /* Seleção de Cores Pedagógicas em Ordem do Arco-Íris */
    .color-picker {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-top: 4px;
    }
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid #cbd5e1;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
    }
    .color-btn.active {
      border-color: #212121;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      cursor: pointer;
    }
    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: #00e676;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="canvas-box">
      <canvas id="geoCanvas" width="450" height="450"></canvas>
      <div class="info-display" id="infoDisplay">Polígono Regular</div>
    </div>

    <div class="sidebar">
      <div class="control-group">
        <label for="modeSelect">Modo de Visualização:</label>
        <select id="modeSelect" onchange="triggerBuild()">
          <option value="polygon">Polígono Regular</option>
          <option value="fraction">Setor Circular (Fração)</option>
          <option value="grid">Grelha (Fração)</option>
        </select>
      </div>

      <!-- Escolha da Cor Uniforme na Sequência do Arco-Íris (ROYGBIV) -->
      <div class="control-group">
        <label>Cor do Preenchimento:</label>
        <div class="color-picker">
          <div class="color-btn active" style="background: #ff1744;" title="Vermelho" onclick="selectColor('#ff1744', this)"></div>
          <div class="color-btn" style="background: #ff7043;" title="Laranja" onclick="selectColor('#ff7043', this)"></div>
          <div class="color-btn" style="background: #ffca28;" title="Amarelo" onclick="selectColor('#ffca28', this)"></div>
          <div class="color-btn" style="background: #00e676;" title="Verde" onclick="selectColor('#00e676', this)"></div>
          <div class="color-btn" style="background: #29b6f6;" title="Ciano/Azul Claro" onclick="selectColor('#29b6f6', this)"></div>
          <div class="color-btn" style="background: #1e88e5;" title="Azul Escuro" onclick="selectColor('#1e88e5', this)"></div>
          <div class="color-btn" style="background: #ab47bc;" title="Violeta/Roxo" onclick="selectColor('#ab47bc', this)"></div>
        </div>
      </div>

      <!-- Controlos do Polígono -->
      <div class="control-group" id="polygonControls">
        <label for="sidesInput">
          <span>Lados (N):</span>
          <span id="sidesVal">5</span>
        </label>
        <input type="range" id="sidesInput" min="3" max="12" value="5" oninput="triggerBuild()">
      </div>

      <!-- Controlos de Fração -->
      <div class="control-group" id="fractionControls" style="display:none;">
        <label for="numInput">
          <span>Numerador (Partes Consideradas):</span>
          <span id="numVal">3</span>
        </label>
        <input type="range" id="numInput" min="1" max="8" value="3" oninput="triggerBuild()">

        <label for="denomInput" style="margin-top:10px;">
          <span>Denominador (Total de Partes):</span>
          <span id="denomVal">8</span>
        </label>
        <input type="range" id="denomInput" min="2" max="16" value="8" oninput="triggerBuild()">
      </div>

      <!-- Opções extra -->
      <div class="checkbox-group" id="diagonalsGroup">
        <input type="checkbox" id="showDiagonals" onchange="triggerBuild()">
        <label for="showDiagonals" style="margin:0;">Mostrar Diagonais / Eixos</label>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    let currentColor = '#ff1744';
    let progress = 0;
    let animId = null;

    function selectColor(colorHex, btn) {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentColor = colorHex;
      triggerBuild();
    }

    function triggerBuild() {
      cancelAnimationFrame(animId);
      progress = 0;

      function animateBuild() {
        progress += 0.04;
        if (progress > 1) progress = 1;

        drawPattern();

        if (progress < 1) {
          animId = requestAnimationFrame(animateBuild);
        }
      }
      animateBuild();
    }

    function drawPattern() {
      const mode = document.getElementById('modeSelect').value;
      const showDiags = document.getElementById('showDiagonals').checked;

      const polyControls = document.getElementById('polygonControls');
      const fracControls = document.getElementById('fractionControls');
      const diagsGroup = document.getElementById('diagonalsGroup');
      const info = document.getElementById('infoDisplay');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (mode === 'polygon') {
        polyControls.style.display = 'flex';
        fracControls.style.display = 'none';
        diagsGroup.style.display = 'flex';

        const n = parseInt(document.getElementById('sidesInput').value, 10);
        document.getElementById('sidesVal').textContent = n;

        const names = { 3: "Triângulo Equilátero", 4: "Quadrado", 5: "Pentágono Regular", 6: "Hexágono Regular", 7: "Heptágono Regular", 8: "Octógono Regular", 9: "Eneágono Regular", 10: "Decágono Regular", 11: "Endecágono Regular", 12: "Dodecágono Regular" };
        info.innerHTML = names[n] || `${n}-ágono Regular`;

        drawPolygon(n, showDiags);

      } else if (mode === 'fraction' || mode === 'grid') {
        polyControls.style.display = 'none';
        fracControls.style.display = 'flex';
        diagsGroup.style.display = 'none';

        const denom = parseInt(document.getElementById('denomInput').value, 10);
        const numInput = document.getElementById('numInput');
        numInput.max = denom;
        if (parseInt(numInput.value, 10) > denom) numInput.value = denom;
        const num = parseInt(numInput.value, 10);

        document.getElementById('denomVal').textContent = denom;
        document.getElementById('numVal').textContent = num;

        // Renderização com Notação Fracionária na Vertical
        const prefixText = mode === 'fraction' ? "Fração Representada:" : "Área Representada:";
        info.innerHTML = `
          <span>${prefixText}</span>
          <div class="fraction-display">
            <span class="fraction-numerator">${num}</span>
            <span class="fraction-denominator">${denom}</span>
          </div>
        `;

        if (mode === 'fraction') {
          drawPieFraction(num, denom);
        } else {
          drawGridFraction(num, denom);
        }
      }
    }

    function drawPolygon(n, showDiags) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 170;
      const vertices = [];

      for (let i = 0; i < n; i++) {
        const angle = (i * 2 * Math.PI / n) - Math.PI / 2;
        vertices.push({
          x: cx + r * Math.cos(angle),
          y: cy + r * Math.sin(angle)
        });
      }

      if (showDiags) {
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < jMax(i, n); j++) {
            ctx.beginPath();
            ctx.moveTo(vertices[i].x, vertices[i].y);
            const targetX = vertices[i].x + (vertices[j].x - vertices[i].x) * progress;
            const targetY = vertices[i].y + (vertices[j].y - vertices[i].y) * progress;
            ctx.lineTo(targetX, targetY);
            ctx.stroke();
          }
        }
      }

      function jMax(i, total) {
        return Math.min(total, i + 1 + Math.ceil((total - i) * progress));
      }

      ctx.fillStyle = hexToRgba(currentColor, 0.2);
      ctx.beginPath();
      ctx.moveTo(vertices[0].x, vertices[0].y);
      for (let i = 1; i < n; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(vertices[0].x, vertices[0].y);
      const totalEdges = Math.floor(n * progress);
      for (let i = 1; i <= totalEdges; i++) {
        ctx.lineTo(vertices[i % n].x, vertices[i % n].y);
      }
      ctx.stroke();

      vertices.forEach(v => {
        ctx.fillStyle = "#212121";
        ctx.beginPath();
        ctx.arc(v.x, v.y, 6, 0, 2 * Math.PI);
        ctx.fill();
      });
    }

    function drawPieFraction(num, denom) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = 170;
      const sliceAngle = (2 * Math.PI) / denom;

      const animatedNum = num * progress;

      for (let i = 0; i < denom; i++) {
        const start = i * sliceAngle - Math.PI / 2;
        const end = start + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, end);
        ctx.closePath();

        if (i < Math.floor(animatedNum)) {
          ctx.fillStyle = currentColor;
          ctx.fill();
        } else if (i === Math.floor(animatedNum) && animatedNum % 1 !== 0) {
          const partialEnd = start + sliceAngle * (animatedNum % 1);
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, start, partialEnd);
          ctx.closePath();
          ctx.fillStyle = currentColor;
          ctx.fill();
        } else {
          ctx.fillStyle = "#f8fafc";
          ctx.fill();
        }

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      ctx.strokeStyle = "#212121";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.stroke();
    }

    function drawGridFraction(num, denom) {
      const margin = 40;
      const w = canvas.width - margin * 2;
      const h = canvas.height - margin * 2;
      const cols = Math.ceil(Math.sqrt(denom));
      const rows = Math.ceil(denom / cols);
      
      const cellW = w / cols;
      const cellH = h / rows;

      const animatedNum = num * progress;

      let drawn = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (drawn >= denom) break;

          const x = margin + c * cellW;
          const y = margin + r * cellH;

          ctx.beginPath();
          ctx.rect(x, y, cellW, cellH);

          if (drawn < Math.floor(animatedNum)) {
            ctx.fillStyle = currentColor;
            ctx.fill();
          } else if (drawn === Math.floor(animatedNum) && animatedNum % 1 !== 0) {
            ctx.fillStyle = hexToRgba(currentColor, animatedNum % 1);
            ctx.fill();
          } else {
            ctx.fillStyle = "#f8fafc";
            ctx.fill();
          }

          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, cellW, cellH);

          drawn++;
        }
      }
    }

    function hexToRgba(hex, alpha) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    }

    triggerBuild();
  </script>
</body>
</html>
